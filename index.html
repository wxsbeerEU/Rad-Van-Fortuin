<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Royale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <canvas id="wheelCanvas"></canvas>
        <div id="controls">
            <div id="bet-rack">
                <button onclick="setBet(10)">10</button>
                <button onclick="setBet(50)" class="active">50</button>
                <button onclick="setBet(100)">100</button>
                <button onclick="setBet(500)">500</button>
            </div>
            <button id="spinBtn" onclick="spinWheel()">DRAAI</button>
        </div>
        <div id="result-overlay">PLAATS INZET</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
