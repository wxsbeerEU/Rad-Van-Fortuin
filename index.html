<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 GRAND CASINO ROYALE - Rad van Fortuin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@400;600;800;900&family=Rye&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Achtergrond Glow en Lichtbundels -->
  <div class="spotlight left"></div>
  <div class="spotlight right"></div>
  <div class="ambient-glow"></div>

  <main class="casino-stage">
    <!-- Header -->
    <header class="casino-header">
      <div class="crown-icon">👑</div>
      <h1 class="neon-title">GRAND CASINO</h1>
      <div class="badge-gold">KAMP EDITIE • HIGH ROLLER SUITE</div>
    </header>

    <!-- Speelveld Grid -->
    <div class="game-layout">
      
      <!-- Linkerpaneel: Inzetten -->
      <section class="betting-desk">
        <h2 class="section-title">🎰 INZET PLAATSEN</h2>
        <p class="section-sub">Kies je fiches of vul handmatig in</p>

        <div class="bet-display-box">
          <span class="currency-symbol">🪙</span>
          <input type="number" id="customBetInput" value="50" min="5" step="5">
          <span class="unit-label">FICHES</span>
        </div>

        <!-- 3D Casino Chips -->
        <div class="chip-rack">
          <button class="chip chip-10" onclick="setBet(10)">10</button>
          <button class="chip chip-25" onclick="setBet(25)">25</button>
          <button class="chip chip-50 active" onclick="setBet(50)">50</button>
          <button class="chip chip-100" onclick="setBet(100)">100</button>
          <button class="chip chip-250" onclick="setBet(250)">250</button>
          <button class="chip chip-500" onclick="setBet(500)">500</button>
          <button class="chip chip-max" onclick="setBet(1000)">1K</button>
        </div>

        <!-- Snelle vermenigvuldigers voor dealer -->
        <div class="quick-adjust">
          <button class="adjust-btn" onclick="multiplyBet(0.5)">½ Inzet</button>
          <button class="adjust-btn" onclick="multiplyBet(2)">2× Inzet</button>
          <button class="adjust-btn" onclick="clearBet()">Herstel</button>
        </div>

        <!-- Laatste Spins Logboek -->
        <div class="history-card">
          <span class="history-title">📜 LAATSTE UITSLAGEN</span>
          <ul id="historyList" class="history-list">
            <li class="empty-log">Nog geen spins gespeeld</li>
          </ul>
        </div>
      </section>

      <!-- Rechterpaneel: Het Gigantische Rad -->
      <section class="wheel-stage">
        <div class="wheel-outer-casing">
          <!-- LED Ring die knippert/draait -->
          <div class="led-ring" id="ledRing"></div>

          <!-- Pijl / Flipper bovenaan -->
          <div class="pointer-assembly">
            <div class="pointer-arrow" id="pointer"></div>
            <div class="pointer-gem"></div>
          </div>

          <!-- Canvas Rad -->
          <canvas id="wheelCanvas" width="540" height="540"></canvas>

          <!-- Gouden Centrum Hub -->
          <div class="center-gold-cap">
            <div class="center-gem">💎</div>
          </div>
        </div>

        <!-- Spin Knop & Resultaten Banner -->
        <div class="control-console">
          <button id="spinBtn" class="grand-spin-btn" onclick="spinWheel()">
            <span class="btn-shine"></span>
            <span class="btn-label">DRAAI HET RAD!</span>
          </button>
        </div>
      </section>

    </div>

    <!-- Resultaten Pop-up Modal Banner -->
    <div id="resultBanner" class="result-banner">
      <div class="result-content">
        <span class="result-tag" id="resultTag">CASINO UITSLAG</span>
        <h3 class="result-main" id="resultTitle">PLAATS JE INZET</h3>
        <p class="result-payout" id="resultPayout">Klik op de gouden knop om te draaien</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
